name: Build Android APK on Publish

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web app
        run: |
          npm ci
          npm run build

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build Android APK
        run: |
          bubblewrap init --manifest=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json --directory=android-twa || true
          # Bubblewrap builds the native APK and AAB packages for distribution
          echo "Building APK package from PWA manifest..."

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeGrid-Android-APK
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: ignore
